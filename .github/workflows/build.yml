name: build site
on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국 시간 06:17
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
          OPENCHAT_URL: ${{ vars.OPENCHAT_URL }}
      - run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update listings"
          git push
