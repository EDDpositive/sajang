name: build site
on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국 시간 06:17 (생성기나 이 파일을 고치면 바로 다시 만든다)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["build.py", ".github/workflows/build.yml"]
permissions:
  contents: write
concurrency:
  group: build-site
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
        env:
          BIZINFO_KEY: ${{ secrets.BIZINFO_KEY }}
          OPENCHAT_URL: ${{ vars.OPENCHAT_URL }}
      - run: |
          git config user.name "site-bot"
          git config user.email "site-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "update listings"
          git pull --rebase origin main
          git push
      - name: 검색엔진에 새 주소 알리기 (IndexNow)
        continue-on-error: true
        run: sleep 90 && python indexnow.py
